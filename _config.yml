title: Modelos de Gobernanza de Derechos Humanos en Entornos Digitales
description: >-
  Estudio regional sobre modelos de gobernanza de derechos humanos en entornos digitales
  en América Latina — Civic House, en el marco del proyecto de la Fundación Dignitas por
  la Vida, con el apoyo de AECID.
lang: es

theme: just-the-docs
plugins:
  - jekyll-seo-tag

color_scheme: light
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_sort: case_insensitive
heading_anchors: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

back_to_top: true
back_to_top_text: "Volver arriba"

footer_content: "Civic House · Fundación Dignitas por la Vida · Estudio realizado con el apoyo de AECID."

aux_links:
  "Repositorio en GitHub":
    - "https://github.com/exemats/investigacion-modelos-de-gobernanza"
aux_links_new_tab: true

kramdown:
  syntax_highlighter_opts:
    disable: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
